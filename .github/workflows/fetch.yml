name: fetch-fda-onc-notifications

on:
  schedule:
    # UTC → JST 06:17 / 18:17（避开整点排队）
    - cron: "17 21 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        id: fetch
        run: python fetch.py
        continue-on-error: true

      # 每次都提交 meta.json（成功/失败都留痕；同时防止定时任务因 60 天无活动被停用）
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifications.tsv meta.json 2>/dev/null || git add meta.json
          git diff --cached --quiet || git commit -m "fetch: $(date -u +%Y-%m-%dT%H:%MZ) ${{ steps.fetch.outcome }}"
          git push

      - name: Fail if fetch failed
        if: steps.fetch.outcome != 'success'
        run: exit 1
